name: Release

# Le tag est l'unique déclencheur de toute la distribution.
# workflow_dispatch permet de relancer l'éventail si une branche a échoué,
# sans avoir à re-taguer.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex. v0.5.8)"
        required: true

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: typr

permissions:
  contents: write

# Deux releases ne doivent jamais publier en parallèle : elles écriraient sur
# les mêmes canaux (crates.io, Docker Hub, dépôt du playground).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 0. Garde-fou : le tag et Cargo.toml doivent dire la même chose.
  #    C'est ce qui empêche structurellement la dérive entre canaux.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          CARGO_VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
                          | grep '^version' | head -1 | cut -d'"' -f2)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$TAG" != "v$CARGO_VERSION" ]; then
            echo "::error::Le tag ($TAG) ne correspond pas à Cargo.toml (v$CARGO_VERSION)."
            exit 1
          fi

          # Les périphériques doivent porter la même version (nu publish.nu sync)
          VSCODE_VERSION=$(grep -m1 '"version"' editors/vscode/package.json | cut -d'"' -f4)
          RSTUDIO_VERSION=$(grep -m1 '^Version:' editors/rstudio/DESCRIPTION | awk '{print $2}')
          FAIL=0
          [ "$VSCODE_VERSION" != "$CARGO_VERSION" ] && { echo "::error::extension VS Code en $VSCODE_VERSION au lieu de $CARGO_VERSION — lance 'nu publish.nu sync'"; FAIL=1; }
          [ "$RSTUDIO_VERSION" != "$CARGO_VERSION" ] && { echo "::error::runner RStudio en $RSTUDIO_VERSION au lieu de $CARGO_VERSION — lance 'nu publish.nu sync'"; FAIL=1; }
          exit $FAIL

  # ---------------------------------------------------------------------------
  # 1. Binaires multi-plateformes
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (Linux ARM)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ env.BINARY_NAME }}-${{ needs.verify.outputs.tag }}-${{ matrix.target }}.tar.gz ${{ env.BINARY_NAME }}

      - name: Prepare artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ env.BINARY_NAME }}.exe -DestinationPath ../../../${{ env.BINARY_NAME }}-${{ needs.verify.outputs.tag }}-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ needs.verify.outputs.tag }}-${{ matrix.target }}.${{ matrix.archive }}

  # ---------------------------------------------------------------------------
  # 2. Release GitHub — la source dont tous les autres canaux tirent le binaire
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.tag, 'alpha') || contains(needs.verify.outputs.tag, 'beta') || contains(needs.verify.outputs.tag, 'rc') }}

  # ---------------------------------------------------------------------------
  # 3. crates.io — l'ordre suit le graphe de dépendances.
  #    typr-lsp DOIT passer avant typr-cli : une dépendance `path` porteuse d'un
  #    numéro de version exige que le crate existe déjà sur le registre.
  # ---------------------------------------------------------------------------
  crates-io:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          for crate in typr-core typr-lsp typr-cli typr; do
            PUBLISHED=$(curl -s -H "User-Agent: typr-release" \
              "https://crates.io/api/v1/crates/$crate/$VERSION" \
              | grep -c '"num":"'"$VERSION"'"' || true)
            if [ "$PUBLISHED" != "0" ]; then
              echo "→ $crate $VERSION déjà publié, on passe"
              continue
            fi
            echo "→ cargo publish -p $crate"
            # cargo attend nativement la propagation de l'index depuis 1.66
            cargo publish -p "$crate"
          done

  # ---------------------------------------------------------------------------
  # 4. Docker — consomme le binaire déjà construit, ne recompile rien.
  #    Étiquette la version ET latest : on peut enfin épingler une version.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker image
    needs: [verify, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Fetch the released Linux binary
        run: |
          mkdir -p docker/bin
          curl -sSfL \
            "https://github.com/${{ github.repository }}/releases/download/${{ needs.verify.outputs.tag }}/typr-${{ needs.verify.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C docker/bin
          chmod +x docker/bin/typr

      - uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: |
            fabricehategekimana/typr:${{ needs.verify.outputs.version }}
            fabricehategekimana/typr:latest

  # ---------------------------------------------------------------------------
  # 5. WASM → playground
  # ---------------------------------------------------------------------------
  wasm:
    name: WASM → playground
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build --release --target web crates/typr-wasm

      - name: Attach WASM to the release
        run: |
          mkdir -p wasm-dist
          cp crates/typr-wasm/pkg/*.wasm crates/typr-wasm/pkg/*.js wasm-dist/
          tar -czvf typr-wasm-${{ needs.verify.outputs.tag }}.tar.gz -C wasm-dist .

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          files: typr-wasm-${{ needs.verify.outputs.tag }}.tar.gz

      - name: Push to the playground repository
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git clone --depth 1 \
            "https://x-access-token:${{ secrets.PLAYGROUND_DEPLOY_TOKEN }}@github.com/we-data-ch/typr-playground.github.io.git" \
            playground

          mkdir -p playground/public/wasm
          cp crates/typr-wasm/pkg/*.wasm crates/typr-wasm/pkg/*.js playground/public/wasm/

          # Le playground lit sa version ici au lieu de la coder en dur
          # dans Header.tsx (ce que faisait set_version.nu, à la main).
          printf '{"version":"%s"}\n' "$VERSION" > playground/public/wasm/version.json

          cd playground
          git add public/wasm/
          if git diff --staged --quiet; then
            echo "Aucun changement à déployer."
            exit 0
          fi
          git commit -m "Update WASM to $VERSION"

          # Le dépôt du playground a ses propres contributeurs : si main a bougé
          # entre le clone et le push, on rebase et on réessaie plutôt que
          # d'échouer (ou pire, d'écraser leur travail).
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "WASM $VERSION poussé (tentative $attempt)."
              exit 0
            fi
            echo "push refusé — rebase sur origin/main et nouvelle tentative"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::impossible de pousser le WASM vers le playground après 3 tentatives"
          exit 1

  # ---------------------------------------------------------------------------
  # 6. Extension VS Code → Marketplace
  # ---------------------------------------------------------------------------
  vscode:
    name: VS Code extension (Marketplace + Open VSX)
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    # Au niveau du job pour que l'etape de publication puisse tester sa presence
    # dans son `if` : un `env` de step n'est pas visible depuis son propre `if`.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Package the extension
        run: npx vsce package --out typr-${{ needs.verify.outputs.version }}.vsix

      - name: Attach the .vsix to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          files: editors/vscode/typr-${{ needs.verify.outputs.version }}.vsix

      # Sans VSCE_PAT le .vsix reste attache a la release et reste installable
      # a la main : on n'echoue pas toute la release pour ce seul canal.
      - name: Publish to the Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath typr-${{ needs.verify.outputs.version }}.vsix

      - name: VSCE_PAT absent — publication ignoree
        if: env.VSCE_PAT == ''
        run: |
          echo "::warning title=Marketplace non mise a jour::VSCE_PAT absent ; le .vsix est attache a la release mais n'a pas ete publie."

      # Open VSX est un registre distinct (fondation Eclipse) : Positron,
      # VSCodium et Cursor n'ont pas acces au Marketplace. On republie le .vsix
      # deja empaquete, donc bit pour bit identique a celui de la release.
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish typr-${{ needs.verify.outputs.version }}.vsix -p "$OVSX_PAT"

      - name: OVSX_PAT absent — publication ignoree
        if: env.OVSX_PAT == ''
        run: |
          echo "::warning title=Open VSX non mis a jour::OVSX_PAT absent ; Positron et VSCodium ne verront pas cette version."

  # ---------------------------------------------------------------------------
  # 7. Runner RStudio — le tarball est assemblé ici avec les binaires frais.
  #    C'est ce qui remplace les 33 commits "[auto] updated binaries".
  # ---------------------------------------------------------------------------
  rstudio:
    name: RStudio runner package
    needs: [verify, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Embed the released binaries
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          mkdir -p editors/rstudio/inst/bin

          curl -sSfL "$BASE/typr-$TAG-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C editors/rstudio/inst/bin

          curl -sSfL -o win.zip "$BASE/typr-$TAG-x86_64-pc-windows-msvc.zip"
          unzip -o win.zip -d editors/rstudio/inst/bin
          rm win.zip

          chmod +x editors/rstudio/inst/bin/typr
          ls -la editors/rstudio/inst/bin/

      - name: Build the R source package
        run: |
          sudo apt-get update && sudo apt-get install -y r-base-core
          R CMD build editors/rstudio
          ls -la *.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          files: typr.runner_*.tar.gz

  # ---------------------------------------------------------------------------
  # 8. Documentation — reconstruite pour refléter la nouvelle version
  # ---------------------------------------------------------------------------
  docs:
    name: Trigger docs rebuild
    needs: [verify, release]
    runs-on: ubuntu-latest
    # Au niveau du job pour rester testable depuis le `if` des steps.
    env:
      DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch to typr.github.io
        if: env.DOCS_DISPATCH_TOKEN != ''
        run: |
          curl -sSfL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DOCS_DISPATCH_TOKEN" \
            https://api.github.com/repos/we-data-ch/typr.github.io/dispatches \
            -d '{"event_type":"typr-release","client_payload":{"version":"${{ needs.verify.outputs.version }}"}}'

      # La doc se redeploie de toute facon a chaque push sur son propre depot ;
      # ce dispatch ne sert qu'a la rafraichir au moment d'une release.
      - name: DOCS_DISPATCH_TOKEN absent — doc non rafraichie
        if: env.DOCS_DISPATCH_TOKEN == ''
        run: |
          echo "::warning title=Doc non rafraichie::DOCS_DISPATCH_TOKEN absent ; typr.github.io n'a pas ete redeploye pour cette release."
