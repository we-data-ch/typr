name: Release

# Le tag est l'unique déclencheur de toute la distribution.
# workflow_dispatch permet de relancer l'éventail si une branche a échoué,
# sans avoir à re-taguer.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex. v0.5.8)"
        required: true

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: typr

permissions:
  contents: write

# Deux releases ne doivent jamais publier en parallèle : elles écriraient sur
# les mêmes canaux (crates.io, Docker Hub, dépôt du playground).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 0. Garde-fou : le tag et Cargo.toml doivent dire la même chose.
  #    C'est ce qui empêche structurellement la dérive entre canaux.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          CARGO_VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
                          | grep '^version' | head -1 | cut -d'"' -f2)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$TAG" != "v$CARGO_VERSION" ]; then
            echo "::error::Le tag ($TAG) ne correspond pas à Cargo.toml (v$CARGO_VERSION)."
            exit 1
          fi

          # Les périphériques doivent porter la même version (nu publish.nu sync)
          VSCODE_VERSION=$(grep -m1 '"version"' editors/vscode/package.json | cut -d'"' -f4)
          RSTUDIO_VERSION=$(grep -m1 '^Version:' editors/rstudio/DESCRIPTION | awk '{print $2}')
          FAIL=0
          [ "$VSCODE_VERSION" != "$CARGO_VERSION" ] && { echo "::error::extension VS Code en $VSCODE_VERSION au lieu de $CARGO_VERSION — lance 'nu publish.nu sync'"; FAIL=1; }
          [ "$RSTUDIO_VERSION" != "$CARGO_VERSION" ] && { echo "::error::runner RStudio en $RSTUDIO_VERSION au lieu de $CARGO_VERSION — lance 'nu publish.nu sync'"; FAIL=1; }
          exit $FAIL

  # ---------------------------------------------------------------------------
  # 1. Binaires multi-plateformes
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux musl — la cible que vise le script d'installation par défaut.
          # Liée statiquement : aucune contrainte de glibc, donc le binaire
          # démarre sur Rocky 9, Debian 12, Ubuntu 22.04 *et* Alpine. C'est le
          # correctif du défaut mesuré sur v0.5.12 (`GLIBC_2.39 not found`).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # Linux GNU — repli, construit sur 22.04 et non sur `latest` : `ubuntu-latest`
          # passe à Ubuntu 26.04 en novembre 2026 (actions/runner-images#14748) et
          # ferait monter le plancher de glibc de 2.35 à ~2.42 sans qu'une ligne du
          # dépôt change. Ici le plancher est figé, quoi qu'il arrive au runner.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            cross: true
          # `+crt-static` lie le runtime C : VCRUNTIME140.dll et les
          # api-ms-win-crt-* du VC++ Redistributable disparaissent des imports.
          # Sans ce flag, l'installation aboutit puis `typr --version` échoue
          # sur un Windows 10/11 frais (DLL introuvable).
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            rustflags: -C target-feature=+crt-static
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
            rustflags: -C target-feature=+crt-static
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (Linux non natif)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross
        env:
          # `-C target-feature=+crt-static` sur les cibles `*-msvc` ; vide
          # partout ailleurs. Comme `--target` est toujours passé, cargo
          # n'applique pas RUSTFLAGS aux build scripts ni aux proc macros.
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ env.BINARY_NAME }}-${{ needs.verify.outputs.tag }}-${{ matrix.target }}.tar.gz ${{ env.BINARY_NAME }}

      - name: Prepare artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ env.BINARY_NAME }}.exe -DestinationPath ../../../${{ env.BINARY_NAME }}-${{ needs.verify.outputs.tag }}-${{ matrix.target }}.zip

      # La liaison statique du runtime C ne se constate qu'en inspectant le PE
      # produit : rustc accepte le flag, mais rien ne garantit qu'il ait été
      # honoré. C'était le point non vérifié de l'analyse, donc on le vérifie ici
      # plutôt que de le croire — sinon le défaut revient en silence au premier
      # changement de dépendance.
      - name: Runtime C statique (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                  -property installationPath
          if (-not $vs) { throw "Outils C++ de Visual Studio introuvables sur le runner" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"

          # dumpbin n'est pas dans le PATH du runner : il faut l'environnement VC.
          $dlls = cmd /c "`"$vcvars`" >nul 2>&1 && dumpbin /nologo /dependents `"$exe`""
          if ($LASTEXITCODE -ne 0) { throw "dumpbin /dependents a échoué sur $exe" }
          Write-Host $dlls

          # UCRT et VCRUNTIME viennent tous deux du VC++ Redistributable, absent
          # d'un Windows 10/11 frais. S'ils réapparaissent, l'installation
          # paraîtra réussie et `typr --version` échouera.
          $runtime = $dlls | Select-String -Pattern 'VCRUNTIME140|VCRUNTIME140_1|MSVCP140|api-ms-win-crt-|ucrtbase\.dll'
          if ($runtime) {
            Write-Host "::error::le binaire importe encore le runtime du VC++ Redistributable :"
            Write-Host $runtime
            exit 1
          }
          Write-Host "Runtime C statique : aucune DLL du VC++ Redistributable importée."

      # C'est cette étape — `typr --version` dans une distro vierge — qui échouait
      # en septembre 2026 avec les binaires GNU, sur les 3 premières
      # distributions. Un binaire musl qui trahirait un interpréteur
      # (`PT_INTERP`) ne fonctionnerait que sur Alpine, et le défaut
      # reviendrait sans qu'aucun test ne le voie : d'où les deux garde-fous.
      - name: Binaire musl statique et exécutable
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          BIN="$PWD/target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          file "$BIN"
          # On lit la table de segments en entier plutôt que de s'arrêter à la
          # première correspondance : `grep -q` sous `pipefail` laisse la
          # garde-fou dépendre du tampon de pipe, et le décompte sert aussi au
          # message d'erreur.
          INTERP=$(readelf -lW "$BIN" | grep -cE '\bINTERP\b' || true)
          if [ "$INTERP" -ne 0 ]; then
            echo "::error::$BIN déclare un interpréteur — il n'est pas statique et ne tournera que sur Alpine"
            exit 1
          fi
          for IMAGE in rockylinux:9 debian:12 alpine:3.20; do
            echo "→ $IMAGE"
            docker run --rm -v "$BIN:/w/typr:ro" "$IMAGE" sh -c '/w/typr --version'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ needs.verify.outputs.tag }}-${{ matrix.target }}.${{ matrix.archive }}

  # ---------------------------------------------------------------------------
  # 2. Release GitHub — la source dont tous les autres canaux tirent le binaire
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.tag, 'alpha') || contains(needs.verify.outputs.tag, 'beta') || contains(needs.verify.outputs.tag, 'rc') }}

  # ---------------------------------------------------------------------------
  # 3. crates.io — l'ordre suit le graphe de dépendances.
  #    typr-lsp et typr-mcp DOIVENT passer avant typr-cli : une dépendance
  #    `path` porteuse d'un numéro de version exige que le crate existe déjà
  #    sur le registre.
  # ---------------------------------------------------------------------------
  crates-io:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          for crate in typr-core typr-lsp typr-mcp typr-cli typr; do
            PUBLISHED=$(curl -s -H "User-Agent: typr-release" \
              "https://crates.io/api/v1/crates/$crate/$VERSION" \
              | grep -c '"num":"'"$VERSION"'"' || true)
            if [ "$PUBLISHED" != "0" ]; then
              echo "→ $crate $VERSION déjà publié, on passe"
              continue
            fi
            echo "→ cargo publish -p $crate"
            # cargo attend nativement la propagation de l'index depuis 1.66
            cargo publish -p "$crate"
          done

  # ---------------------------------------------------------------------------
  # 4. Docker — consomme le binaire déjà construit, ne recompile rien.
  #    Étiquette la version ET latest : on peut enfin épingler une version.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker image
    needs: [verify, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Fetch the released Linux binary
        run: |
          mkdir -p docker/bin
          curl -sSfL \
            "https://github.com/${{ github.repository }}/releases/download/${{ needs.verify.outputs.tag }}/typr-${{ needs.verify.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C docker/bin
          chmod +x docker/bin/typr

      - uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: |
            fabricehategekimana/typr:${{ needs.verify.outputs.version }}
            fabricehategekimana/typr:latest

  # ---------------------------------------------------------------------------
  # 5. WASM → playground
  # ---------------------------------------------------------------------------
  wasm:
    name: WASM → playground
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build --release --target web crates/typr-wasm

      - name: Attach WASM to the release
        run: |
          mkdir -p wasm-dist
          cp crates/typr-wasm/pkg/*.wasm crates/typr-wasm/pkg/*.js wasm-dist/
          tar -czvf typr-wasm-${{ needs.verify.outputs.tag }}.tar.gz -C wasm-dist .

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          files: typr-wasm-${{ needs.verify.outputs.tag }}.tar.gz

      - name: Push to the playground repository
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git clone --depth 1 \
            "https://x-access-token:${{ secrets.PLAYGROUND_DEPLOY_TOKEN }}@github.com/we-data-ch/typr-playground.github.io.git" \
            playground

          mkdir -p playground/public/wasm
          cp crates/typr-wasm/pkg/*.wasm crates/typr-wasm/pkg/*.js playground/public/wasm/

          # Le playground lit sa version ici au lieu de la coder en dur
          # dans Header.tsx (ce que faisait set_version.nu, à la main).
          printf '{"version":"%s"}\n' "$VERSION" > playground/public/wasm/version.json

          cd playground
          git add public/wasm/
          if git diff --staged --quiet; then
            echo "Aucun changement à déployer."
            exit 0
          fi
          git commit -m "Update WASM to $VERSION"

          # Le dépôt du playground a ses propres contributeurs : si main a bougé
          # entre le clone et le push, on rebase et on réessaie plutôt que
          # d'échouer (ou pire, d'écraser leur travail).
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "WASM $VERSION poussé (tentative $attempt)."
              exit 0
            fi
            echo "push refusé — rebase sur origin/main et nouvelle tentative"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::impossible de pousser le WASM vers le playground après 3 tentatives"
          exit 1

  # ---------------------------------------------------------------------------
  # 6. Extension VS Code → Marketplace
  # ---------------------------------------------------------------------------
  vscode:
    name: VS Code extension (Marketplace + Open VSX)
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    # Au niveau du job pour que l'etape de publication puisse tester sa presence
    # dans son `if` : un `env` de step n'est pas visible depuis son propre `if`.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Package the extension
        run: npx vsce package --out typr-${{ needs.verify.outputs.version }}.vsix

      - name: Attach the .vsix to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          files: editors/vscode/typr-${{ needs.verify.outputs.version }}.vsix

      # Sans VSCE_PAT le .vsix reste attache a la release et reste installable
      # a la main : on n'echoue pas toute la release pour ce seul canal.
      # Le Marketplace repond parfois par un "Request timeout: /_apis/gallery"
      # transitoire (aucun rapport avec le .vsix) : on retente avant d'abandonner.
      - name: Publish to the Marketplace
        if: env.VSCE_PAT != ''
        run: |
          for attempt in 1 2 3; do
            if npx vsce publish --packagePath typr-${{ needs.verify.outputs.version }}.vsix; then
              exit 0
            fi
            echo "tentative $attempt/3 echouee, nouvel essai dans 30s"
            sleep 30
          done
          exit 1

      - name: VSCE_PAT absent — publication ignoree
        if: env.VSCE_PAT == ''
        run: |
          echo "::warning title=Marketplace non mise a jour::VSCE_PAT absent ; le .vsix est attache a la release mais n'a pas ete publie."

      # Open VSX est un registre distinct (fondation Eclipse) : Positron,
      # VSCodium et Cursor n'ont pas acces au Marketplace. On republie le .vsix
      # deja empaquete, donc bit pour bit identique a celui de la release.
      - name: Publish to Open VSX
        if: always() && env.OVSX_PAT != ''
        run: npx ovsx publish typr-${{ needs.verify.outputs.version }}.vsix -p "$OVSX_PAT"

      - name: OVSX_PAT absent — publication ignoree
        if: always() && env.OVSX_PAT == ''
        run: |
          echo "::warning title=Open VSX non mis a jour::OVSX_PAT absent ; Positron et VSCodium ne verront pas cette version."

  # ---------------------------------------------------------------------------
  # 7. Runner RStudio — le tarball est assemblé ici avec les binaires frais.
  #    C'est ce qui remplace les 33 commits "[auto] updated binaries".
  # ---------------------------------------------------------------------------
  rstudio:
    name: RStudio runner package
    needs: [verify, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Embed the released binaries
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          mkdir -p editors/rstudio/inst/bin

          curl -sSfL "$BASE/typr-$TAG-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C editors/rstudio/inst/bin

          curl -sSfL -o win.zip "$BASE/typr-$TAG-x86_64-pc-windows-msvc.zip"
          unzip -o win.zip -d editors/rstudio/inst/bin
          rm win.zip

          chmod +x editors/rstudio/inst/bin/typr
          ls -la editors/rstudio/inst/bin/

      - name: Build the R source package
        run: |
          sudo apt-get update && sudo apt-get install -y r-base-core
          R CMD build editors/rstudio
          ls -la *.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          files: typr.runner_*.tar.gz

  # ---------------------------------------------------------------------------
  # 7b. Plugin Vim / Neovim — pas de store central, donc tarball joint à la
  #     release. La distribution standard (plugin managers git) reste la
  #     source principale ; l'archive sert à l'installation native.
  # ---------------------------------------------------------------------------
  vim:
    name: Vim / Neovim plugin tarball
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Create the plugin archive
        run: tar -czf typr-vim-${{ needs.verify.outputs.version }}.tar.gz -C editors/vim .

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          files: typr-vim-${{ needs.verify.outputs.version }}.tar.gz

  # ---------------------------------------------------------------------------
  # 7c. Grammaire → playground + documentation
  #
  #     `editors/vscode/syntaxes/typr.tmLanguage.json` est généré depuis le
  #     manifeste (`typr syntax --write`) et vérifié par `cargo test`
  #     (crates/typr-cli/tests/generated_grammars.rs). Les deux sites le lisent
  #     avec Shiki ; ils en gardent donc une copie, qui doit venir d'ici et
  #     jamais d'une retranscription à la main — c'est exactement comme ça que
  #     les six définitions de la syntaxe avaient divergé.
  # ---------------------------------------------------------------------------
  grammar:
    name: Grammar → playground + docs
    needs: verify
    runs-on: ubuntu-latest
    env:
      PLAYGROUND_DEPLOY_TOKEN: ${{ secrets.PLAYGROUND_DEPLOY_TOKEN }}
      DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Push the generated grammar to both sites
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          push_grammar() {
            local repo="$1" token="$2" dir="$3"
            if [ -z "$token" ]; then
              echo "::warning title=Grammaire non poussée::jeton absent pour $repo ; sa copie de typr.tmLanguage.json reste sur la version précédente."
              return 0
            fi

            git clone --depth 1 "https://x-access-token:$token@github.com/we-data-ch/$repo.git" "$dir"
            mkdir -p "$dir/syntaxes"
            cp editors/vscode/syntaxes/typr.tmLanguage.json "$dir/syntaxes/typr.tmLanguage.json"

            cd "$dir"
            git add syntaxes/typr.tmLanguage.json
            if git diff --staged --quiet; then
              echo "$repo : grammaire déjà à jour."
              cd ..
              return 0
            fi
            git commit -m "Update TypR grammar to $VERSION"

            # Même précaution que pour le WASM : ces dépôts ont leurs propres
            # contributeurs, on rebase plutôt que d'écraser leur travail.
            for attempt in 1 2 3; do
              if git push origin main; then
                echo "$repo : grammaire $VERSION poussée (tentative $attempt)."
                cd ..
                return 0
              fi
              echo "push refusé — rebase sur origin/main et nouvelle tentative"
              git fetch origin main
              git rebase origin/main
            done
            echo "::error::impossible de pousser la grammaire vers $repo après 3 tentatives"
            return 1
          }

          push_grammar typr-playground.github.io "$PLAYGROUND_DEPLOY_TOKEN" playground
          push_grammar typr.github.io "$DOCS_DEPLOY_TOKEN" docs

  # ---------------------------------------------------------------------------
  # 8. Documentation — reconstruite pour refléter la nouvelle version
  # ---------------------------------------------------------------------------
  docs:
    name: Trigger docs rebuild
    needs: [verify, release]
    runs-on: ubuntu-latest
    # Au niveau du job pour rester testable depuis le `if` des steps.
    env:
      DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch to typr.github.io
        if: env.DOCS_DISPATCH_TOKEN != ''
        run: |
          curl -sSfL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DOCS_DISPATCH_TOKEN" \
            https://api.github.com/repos/we-data-ch/typr.github.io/dispatches \
            -d '{"event_type":"typr-release","client_payload":{"version":"${{ needs.verify.outputs.version }}"}}'

      # La doc se redeploie de toute facon a chaque push sur son propre depot ;
      # ce dispatch ne sert qu'a la rafraichir au moment d'une release.
      - name: DOCS_DISPATCH_TOKEN absent — doc non rafraichie
        if: env.DOCS_DISPATCH_TOKEN == ''
        run: |
          echo "::warning title=Doc non rafraichie::DOCS_DISPATCH_TOKEN absent ; typr.github.io n'a pas ete redeploye pour cette release."

  # ---------------------------------------------------------------------------
  # 8b. Homebrew — le tap reçoit une formule *générée*, jamais écrite à la main.
  #
  #     Un SHA-256 recopié à la main finit toujours par désigner un binaire qui
  #     n'est plus celui de la release : l'erreur n'apparaît qu'à
  #     l'installation, chez l'utilisateur. Ici les empreintes sont lues dans le
  #     `checksums.txt` que la release vient de publier, puis vérifiées contre
  #     l'archive réellement téléchargée avant d'être commitées.
  #
  #     Indépendant des autres canaux, comme `vscode` et `vim` : un push refusé
  #     sur le tap ne doit pas empêcher les binaires d'arriver.
  # ---------------------------------------------------------------------------
  brew:
    name: Homebrew tap
    needs: [verify, release]
    runs-on: macos-latest
    # Au niveau du job pour que l'étape de publication puisse tester sa présence
    # dans son propre `if` : un `env` de step n'y est pas visible.
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Récupérer checksums.txt de la release
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          curl -fsSfL \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/checksums.txt" \
            -o checksums.txt
          cat checksums.txt

      - name: Générer la formule et le README du tap
        run: |
          set -euo pipefail
          packaging/homebrew/render.sh \
            --tag "${{ needs.verify.outputs.tag }}" \
            --checksums checksums.txt \
            --out tap
          cat tap/Formula/typr.rb

      # La formule reprend `checksums.txt`, donc son empreinte est correcte par
      # construction — sauf si le fichier a été réécrit entre le rendu et cet
      # instant, ou si la ligne lue était celle d'un autre artefact. On
      # télécharge donc une archive pour de vrai et on la compare : c'est le seul
      # endroit où une erreur de sélection se verrait avant le commit.
      - name: L'empreinte de la formule correspond à l'archive publiée
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          ARTIFACT="typr-$TAG-aarch64-apple-darwin.tar.gz"
          curl -fsSfL \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/$ARTIFACT" \
            -o "$ARTIFACT"
          ACTUAL=$(shasum -a 256 "$ARTIFACT" | cut -d' ' -f1)
          rm -f "$ARTIFACT"
          if ! grep -Fq "$ACTUAL" tap/Formula/typr.rb; then
            echo "::error::l'empreinte de $ARTIFACT ($ACTUAL) ne figure pas dans la formule rendue"
            exit 1
          fi
          echo "archive publiée et formule d'accord : $ACTUAL"

      # `brew style` et `brew audit` jugent la formule comme le ferait
      # l'utilisateur, et rien ici ne les remplace : ni ruby ni Homebrew ne
      # tournent sous Linux. Une formule qu'ils refusent n'est pas committée.
      #
      # Le fichier est déposé dans un vrai tap (`Library/Taps/<user>/<repo>`) :
      # c'est ce que fait `brew tap`, et c'est ce que rubocop attend pour
      # connaître le nom du tap.
      - name: Homebrew accepte la formule
        run: |
          set -euo pipefail
          TAP_DIR="$(brew --repository)/Library/Taps/we-data-ch/homebrew-typr"
          mkdir -p "$TAP_DIR/Formula"
          cp tap/Formula/typr.rb "$TAP_DIR/Formula/typr.rb"
          cp tap/README.md "$TAP_DIR/README.md"

          # `brew readall` va plus loin que `brew style` : il charge la formule
          # comme le fera `brew install`. Une formule que Homebrew sait lire mais
          # pas charger est detectable ici, et nulle part ailleurs.
          brew readall "$TAP_DIR"
          brew style "$TAP_DIR/Formula/typr.rb"
          brew audit --strict --formula="$TAP_DIR/Formula/typr.rb"

      - name: Pousser la formule vers le tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Clone complet, pas `--depth 1` comme les autres canaux : en cas de
          # push refusé il faut pouvoir rebaser, et un clone superficiel refuse
          # de rebaser sur un historique qu'il n'a pas. Le tap fait quelques
          # dizaines de kilo-octets.
          git clone \
            "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/we-data-ch/homebrew-typr.git" \
            taprepo

          mkdir -p taprepo/Formula
          cp tap/Formula/typr.rb taprepo/Formula/typr.rb
          cp tap/README.md taprepo/README.md
          cp LICENSE taprepo/LICENSE

          git -C taprepo add Formula/typr.rb README.md LICENSE
          if git -C taprepo diff --cached --quiet; then
            echo "Le tap est déjà à jour ($VERSION)."
            exit 0
          fi
          git -C taprepo commit -m "TypR $VERSION"

          # Le tap a ses propres contributeurs : on rebase plutôt que d'écraser.
          for attempt in 1 2 3; do
            if git -C taprepo push origin HEAD:main; then
              echo "tap $VERSION poussé (tentative $attempt)."
              exit 0
            fi
            echo "push refusé — rebase sur origin/main et nouvelle tentative"
            git -C taprepo fetch origin main
            git -C taprepo rebase origin/main
          done
          echo "::error::impossible de pousser la formule vers le tap après 3 tentatives"
          exit 1

      # Sans jeton, le tap reste sur la version précédente : on le dit, on ne
      # casse pas toute la release pour un seul canal — la règle que RELEASING.md
      # énonce déjà.
      - name: HOMEBREW_TAP_TOKEN absent — tap non mis à jour
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: |
          echo "::warning title=Homebrew non mis a jour::HOMEBREW_TAP_TOKEN absent ; le tap garde sa version precedente."

  # ---------------------------------------------------------------------------
  # WinGet — pull request vers microsoft/winget-pkgs
  #
  # Ce job dépend d'un jeton GitHub ayant `public_repo` : winget-pkgs est un dépôt
  # public, dans lequel il faut pouvoir ouvrir une pull request. Sans jeton, les
  # étapes de rendu et de contrôle s'exécutent quand même, et seule la soumission
  # est sautée.
  # ---------------------------------------------------------------------------
  winget:
    name: WinGet manifest
    needs: [verify, release]
    runs-on: windows-latest
    # Au niveau du job pour que l'étape de publication puisse tester sa présence
    # dans son propre `if` : un `env` de step n'y est pas visible.
    env:
      WINGET_CREATE_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Récupérer checksums.txt de la release
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          curl -fsSfL \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/checksums.txt" \
            -o checksums.txt
          cat checksums.txt

      - name: Générer les manifestes depuis checksums.txt
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          packaging/render.sh --tag "$TAG" --checksums checksums.txt --out manifests
          find manifests -type f | sort

      # Les manifestes reprennent `checksums.txt`, donc leur empreinte est
      # correcte par construction — sauf si le fichier a été réécrit entre le
      # rendu et cet instant, ou si la ligne lue était celle d'un autre artefact.
      # On télécharge donc les deux archives pour de vrai et on les compare :
      # c'est le seul endroit où une erreur de sélection se verrait avant la
      # soumission. `Get-FileHash` plutôt qu'un `sha256sum` de Git Bash, pour
      # ne pas dépendre du jeu d'outils embarqué par Git for Windows.
      - name: Les empreintes des manifestes correspondent aux archives publiées
        shell: pwsh
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @('x86_64', 'aarch64')
          # Les manifestes sont lus et accolés en une seule chaîne : `Contains`
          # sur un tableau teste l'égalité d'un élément, pas la présence d'un
          # motif — l'assertion passerait donc pour n'importe quelle empreinte.
          $manifests = (Get-ChildItem -Recurse manifests -File |
                         ForEach-Object { Get-Content -Raw $_.FullName }) -join "`n"

          foreach ($target in $targets) {
            $artifact = "typr-$env:TAG-$target-pc-windows-msvc.zip"
            $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$artifact"
            Invoke-WebRequest -Uri $url -OutFile $artifact
            $actual = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLowerInvariant()
            Remove-Item $artifact

            if (-not $manifests.Contains($actual)) {
              throw "l'empreinte de $artifact ($actual) ne figure dans aucun manifeste rendu"
            }
            Write-Host "$artifact : $actual, présente dans les manifestes rendus"
          }

      # `wingetcreate submit <dossier>` est la commande prévue pour une première
      # soumission : `update` exigerait que le paquet existe déjà dans
      # winget-pkgs. Le chemin de destination (`manifests/w/we-data-ch/typpr/
      # <version>/`) est calculé par l'outil d'après le contenu des manifestes ;
      # le dossier rendu n'a donc pas besoin d'être pré-dispositionné.
      #
      # L'outil valide les fichiers avec le validateur officiel de WinGet avant
      # d'ouvrir la pull request : c'est le même contrôle que winget-pkgs
      # appliquera, et il échoue ici plutôt qu'après la fusion.
      #
      # Le jeton passe par la variable d'environnement `WINGET_CREATE_GITHUB_TOKEN`
      # et non par `--token` : sur la ligne de commande il apparaîtrait dans la
      # liste des processus du runner et dans les journaux.
      #
      # `wingetcreate` réécrit les manifestes avec son propre sérialiseur : les
      # commentaires de nos gabarits ne se retrouvent donc pas dans la pull
      # request. Ce qui compte — les champs — est celui que l'outil a validé.
      - name: wingetcreate
        if: env.WINGET_CREATE_TOKEN != ''
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          Invoke-WebRequest `
            -Uri https://github.com/microsoft/winget-create/releases/latest/download/wingetcreate.exe `
            -OutFile wingetcreate.exe

          $env:WINGET_CREATE_GITHUB_TOKEN = $env:WINGET_CREATE_TOKEN
          & .\wingetcreate.exe submit --prtitle "TypR $env:VERSION" --no-open manifests/winget
          if ($LASTEXITCODE -ne 0) {
            throw "wingetcreate submit a échoué (code $LASTEXITCODE)"
          }

      # `wingetcreate` n'a pas de commande `validate` autonome, et `submit` exige
      # une authentification même pour valider : sans jeton, la validation
      # officielle ne peut pas tourner ici. Elle a alors lieu à chaque PR, dans
      # le job `packaging-win` de ci.yml, contre les schémas JSON de winget-pkgs.
      - name: WINGET_CREATE_GITHUB_TOKEN absent — manifestes non soumis
        if: env.WINGET_CREATE_TOKEN == ''
        shell: bash
        run: |
          echo "::warning title=WinGet non publie::WINGET_CREATE_GITHUB_TOKEN absent ; les manifestes rendus sont valides (job packaging-win de ci.yml) mais aucune pull request n'est ouverte."

  # ---------------------------------------------------------------------------
  # Scoop — commit vers we-data-ch/scoop-bucket, après installation réelle
  #
  # Contrairement à WinGet, un bucket est un dépôt ordinaire : pas de compte à
  # créer, pas de validation à passer. Le contrôle utile n'est donc pas la
  # validation du manifeste — Scoop n'en fait pas au commit — mais
  # l'installation : `scoop install <manifeste local>` télécharge l'archive
  # publiée, en vérifie l'empreinte, l'extrait et crée le shim `typr`. C'est le
  # seul endroit où toute la chaîne est exercée pour de vrai.
  # ---------------------------------------------------------------------------
  scoop:
    name: Scoop bucket
    needs: [verify, release]
    runs-on: windows-latest
    env:
      SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      # Le bucket est écrit par un clone HTTPS : le jeton apparaît dans l'URL
      # donnée à git, jamais dans un argument de ligne de commande.
      BUCKET_URL: https://x-access-token:${{ secrets.SCOOP_BUCKET_TOKEN }}@github.com/we-data-ch/scoop-bucket.git
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Récupérer checksums.txt de la release
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          curl -fsSfL \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/checksums.txt" \
            -o checksums.txt
          cat checksums.txt

      - name: Générer les manifestes depuis checksums.txt
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          packaging/render.sh --tag "$TAG" --checksums checksums.txt --out manifests
          find manifests -type f | sort

      # Installation réelle depuis le manifeste local : Scoop accepte un chemin
      # vers un fichier de manifeste, ce qui évite d'avoir à publier le bucket
      # avant de pouvoir tester. L'archive est celle de la release, son
      # empreinte est celle du manifeste — une erreur de sélection se verrait
      # ici, à l'extraction.
      #
      # `scoop install` échoue si le hash ne correspond pas, mais on le vérifie
      # quand même séparément : Scoop passe alors par aria2, dont les messages
      # parlent de miroir et pas d'empreinte.
      - name: Scoop installe le binaire publié et le lance
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Le manifeste porte un tiret cadratin ; lu avec l'encodage de
          # console par défaut de Windows PowerShell 5.1, il devient illisible.
          # `pwsh` est en UTF-8 par défaut, on le dit quand même.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8

          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          Write-Host "scoop : $(scoop --version)"

          scoop install "manifests\scoop\typr.json"
          if ($LASTEXITCODE -ne 0) {
            throw "scoop install a échoué (code $LASTEXITCODE)"
          }

          # L'installateur de Scoop met les shims dans le PATH *de l'utilisateur*,
          # donc du PATH du processus seulement à la prochaine session : sans
          # cette ligne, `typr` serait introuvable alors que l'installation a
          # réussi.
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"

          # `typr --version` répond `typr <version>` (clap, `#[command(version)]`).
          $reported = (& typr --version) -join ' '
          Write-Host "typr --version : $reported"
          if ($reported -notmatch [regex]::Escape($env:VERSION)) {
            throw "le binaire installé annonce « $reported », pas la version $env:VERSION de la release"
          }

      - name: Pousser le bucket
        if: env.SCOOP_BUCKET_TOKEN != ''
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Clone complet, pas `--depth 1` : en cas de push refusé il faut pouvoir
          # rebaser, et un clone superficiel refuse de rebaser sur un historique
          # qu'il n'a pas.
          if ! git clone "$BUCKET_URL" bucket; then
            echo "::error::le dépôt we-data-ch/scoop-bucket est inaccessible — il doit exister avant la première release (README.md du dépôt : « Prérequis »)."
            exit 1
          fi

          mkdir -p bucket/bucket bucket/bin/typr
          cp manifests/scoop/bucket/typr.json bucket/bucket/typr.json
          cp "manifests/scoop/bin/typr/$VERSION.json" "bucket/bin/typr/$VERSION.json"
          cp manifests/scoop/README.md bucket/README.md
          cp LICENSE bucket/LICENSE

          # Un bucket garde l'historique : `typr update` sert à cela. On n'en
          # conserve que les dix dernières versions, classées par ordre d'ajout
          # dans l'historique — un tri alphabétique des versions serait faux, et
          # `0.5.9` se retrouverait devant `0.5.12`.
          #
          # `git log` sort du plus récent au plus ancien : il suffit donc de
          # laisser passer les dix premières lignes pour purger les plus anciennes.
          #
          # Le tout premier commit tombe dans un dépôt vide, où `git log` n'a rien
          # à raconter et sortirait en erreur.
          if git -C bucket rev-parse --verify HEAD >/dev/null 2>&1; then
            git -C bucket log --diff-filter=A --name-only --format= -- 'bucket/bin/typr/*.json' \
              | grep -v '^$' | awk '!seen[$0]++' | tail -n +11 \
              | while read -r old; do
                  git -C bucket rm -q "$old"
                  echo "  purgé : $old"
                done
          else
            echo "bucket vide : premier commit, rien à purger."
          fi

          git -C bucket add bucket/typr.json "bucket/bin/typr/$VERSION.json" README.md LICENSE
          if git -C bucket diff --cached --quiet; then
            echo "Le bucket est déjà à jour ($VERSION)."
            exit 0
          fi
          git -C bucket commit -m "TypR $VERSION"

          # Le bucket a ses propres contributeurs : on rebase plutôt que
          # d'écraser.
          for attempt in 1 2 3; do
            if git -C bucket push origin HEAD:main; then
              echo "bucket $VERSION poussé (tentative $attempt)."
              exit 0
            done
            echo "push refusé — rebase sur origin/main et nouvelle tentative"
            git -C bucket fetch origin main
            git -C bucket rebase origin/main
          done
          echo "::error::impossible de pousser le bucket après 3 tentatives"
          exit 1

      - name: SCOOP_BUCKET_TOKEN absent — bucket non mis à jour
        if: env.SCOOP_BUCKET_TOKEN == ''
        shell: bash
        run: |
          echo "::warning title=Scoop non publie::SCOOP_BUCKET_TOKEN absent ; le bucket garde sa version precedente (l installation reelle, elle, a ete verifiee)."
